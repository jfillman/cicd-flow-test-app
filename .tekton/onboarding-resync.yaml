# onboarding-templates/.tekton/onboarding-resync.yaml
#
# BOILERPLATE - see push.yaml for the general explanation. This one is different in
# kind from push.yaml/pull-request.yaml: instead of running this app's own build, it
# re-invokes the onboarding-delivery mechanism itself (catalog/tasks/
# deliver-onboarding-files.yaml) whenever cicd.yaml changes on a push to main -
# `"cicd.yaml".pathChanged()` is a real, documented Pipelines-as-Code CEL extension
# function, not a custom filter. This is Phase 3 item 7's replacement for both the fully
# manual "hand-copy .tekton files" onboarding process and an earlier design considered
# (an ArgoCD-multi-source Application reading cicd.yaml live) that was rejected because
# it would need standing ArgoCD read access to every Application's source repo as a base
# requirement of onboarding itself - see docs/onboarding.md. Reusing PaC's own already-
# trusted webhook auth instead means no new credential class anywhere.
#
# Also fires (same mechanism, same file) if the PLATFORM's own onboarding templates
# change and this Application's copy goes stale - see docs/cicd-yaml-reference.md's
# "Staleness of the platform-generated boilerplate" section, closed by this same
# re-sync path rather than left as a separate, still-unsolved problem.
#
# app-cicd-flow-test-app-cicd, cicd-flow-test-app, jfillman, and (if this Application declared a release stage)
# https://github.com/jfillman/gitops-cicd-flow-test-app are filled in by deliver-onboarding-files.yaml itself when it
# delivers this file - see that Task's own substitution loop, which includes this file
# alongside push.yaml/pull-request.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: onboarding-resync-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: '"cicd.yaml".pathChanged()'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: onboarding-resync }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: git-url, value: "{{ repo_url }}" }
    - { name: app-namespace, value: "app-cicd-flow-test-app-cicd" }
    - { name: app-name, value: "cicd-flow-test-app" }
    - { name: github-owner, value: "jfillman" }
    - { name: gitops-repo-url, value: "https://github.com/jfillman/gitops-cicd-flow-test-app" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
