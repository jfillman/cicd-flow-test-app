# cicd.yaml - deliberately exercises platform-cicd's Phase 3 item 7 multi-flow support:
#   - "ci": git-rooted push->build->test->test->deploy(dev) - the ordinary event-chained
#     case, PLUS two consecutive test stages (exercises flow-triggers.yaml's per-step-index
#     Trigger naming, since two different steps now share the "test" stage name). The two
#     test steps use different `suite` overrides specifically to stay distinguishable now
#     that test requires a resolvable suite name - see docs/cicd-yaml-reference.md.
#   - "pr-check": git-rooted pull_request->build only (image-repo gets the -pr suffix)
#   - "release-on-tag": git-rooted tag push->release(staging) as a single-step flow -
#     exercises the tag/tagPattern trigger path and PaC's release-image reconstruction.
#     Also stands in for "publish a GitHub Release" - confirmed live that Pipelines-as-
#     Code has no support for GitHub's `release` webhook at all (a real delivery came
#     back 200/"skipping non supported event"), so event: release.created was tried, found
#     structurally impossible, and removed from the schema entirely rather than left as a
#     trap. Publishing a Release creates its own tag, which fires this same trigger.
#   - "release-then-test": git-rooted push (gated on a marker file, not every push) ->
#     build->deploy(dev)->release(staging)->test - "release" here is event-chained, not
#     git-rooted (chained from deploy's service.deployed), so a stage can legally follow
#     it; validateFlows only forbids steps after a GIT-ROOTED release. Exercises release's
#     own change.created event actually being consumable by a later stage.
#   - "branch-created-test": git-rooted branch.created on a "preview/*" glob -> build only.
#     Exercises branch.created's trigger.branch pattern actually filtering (fixed live -
#     it used to fire for every newly created branch, matching on nothing) - see
#     docs/cicd-yaml-reference.md.
#
# Chaining order is expressed purely by array position now, not a step-level `after` field
# - it never actually did anything (confirmed by grepping the whole platform for readers
#   of it: zero) and was removed from the schema rather than left as a decorative trap.
apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh

test:
  enabled: true
  suite: integration

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

governance:
  sast: false
  imageScan: false
  policyCheck: false
  sbom: false

secrets:
  - name: slack-webhook-url

notifications:
  slack:
    enabled: true
    channel: "#platform-cicd-test"

pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: test
        env: dev
        suite: unit
      - stage: test
        env: dev
        suite: integration
      - stage: deploy
        env: dev

  pr-check:
    trigger:
      source: git
      event: pull_request
      branch: main
    steps:
      - stage: build

  release-on-tag:
    trigger:
      source: git
      event: tag
      tagPattern: "v[0-9]+\\.[0-9]+\\.[0-9]+"
    steps:
      - stage: release
        env: staging

  release-then-test:
    trigger:
      source: git
      event: push
      branch: main
      filePathPattern: ["RELEASE_THEN_TEST_TRIGGER"]
    steps:
      - stage: build
      - stage: deploy
        env: dev
      - stage: release
        env: staging
      - stage: test
        env: staging

  branch-created-test:
    trigger:
      source: git
      event: branch.created
      branch: "preview/*"
    steps:
      - stage: build
