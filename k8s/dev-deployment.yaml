# Convenience manifest for onboarding this app to platform-cicd - apply this ONCE,
# manually, before the first pipeline run:
#
#   kubectl apply -f k8s/dev-deployment.yaml
#
# catalog/tasks/deploy-manifests.yaml (in platform-cicd) patches this Deployment's image
# and waits for rollout - it does NOT create the namespace/Deployment/Service itself.
# The placeholder image below (registry.k8s.io/pause) won't pass the readiness probe -
# that's expected and fine; the pod stays not-Ready until the first real pipeline
# deploy patches it to a real cicd-flow-test-app image.
apiVersion: v1
kind: Namespace
metadata:
  name: app-cicd-flow-test-app-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-flow-test-app
  namespace: app-cicd-flow-test-app-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: cicd-flow-test-app }
  template:
    metadata:
      labels: { app: cicd-flow-test-app }
    spec:
      containers:
        - name: cicd-flow-test-app
          image: registry.k8s.io/pause:3.9 # placeholder - patched by the first real deploy
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-flow-test-app
  namespace: app-cicd-flow-test-app-dev
spec:
  selector: { app: cicd-flow-test-app }
  ports:
    - port: 80
      targetPort: 3000
